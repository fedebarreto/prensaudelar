<html lang="es">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #07070d;
    --surface: #101018;
    --surface2: #17171f;
    --border: #1e1e2e;
    --text: #edeaf8;
    --muted: #4e4e70;
    --pos: #4ade80;
    --neu: #94a3b8;
    --neg: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 50% 40% at 25% 35%, rgba(99,102,241,0.055) 0%, transparent 65%),
      radial-gradient(ellipse 45% 35% at 80% 70%, rgba(20,184,166,0.04) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }

  /* ── TOP BAR ── */
  .topbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(7,7,13,0.96);
    backdrop-filter: blur(12px);
    flex-shrink: 0; flex-wrap: wrap; gap: 10px;
  }

  .topbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  h1 { font-family: 'DM Serif Display', serif; font-size: 16px; white-space: nowrap; }
  h1 em { font-style: italic; color: #818cf8; }

  .pill {
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.09em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 3px;
  }
  .pill-a { background: rgba(129,140,248,0.12); border: 1px solid rgba(129,140,248,0.3); color: #818cf8; }
  .pill-b { background: rgba(20,184,166,0.1);  border: 1px solid rgba(20,184,166,0.3);  color: #14b8a6; }

  .topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  /* search */
  .search-wrap { position: relative; }
  #search {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px;
    padding: 5px 10px 5px 26px; border-radius: 5px; outline: none; width: 150px;
    transition: border-color 0.2s;
  }
  #search:focus { border-color: #818cf8; }
  #search::placeholder { color: var(--muted); }
  .si { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }

  /* legend blocks */
  .legend-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .legend-sep { width: 1px; height: 22px; background: var(--border); }

  .leg-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--muted);
    font-family: 'DM Mono', monospace;
    cursor: pointer; padding: 3px 6px; border-radius: 3px;
    transition: background 0.15s, color 0.15s;
  }
  .leg-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .leg-item.off { opacity: 0.25; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .leg-sq  { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .hint { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; }

  /* ── GRAPH ── */
  #gc { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg:active { cursor: grabbing; }

  .link { stroke-linecap: round; }

  /* node shape: tag = circle, service = rounded-rect via circle with dashed stroke */
  .node-glow   { transition: r 0.25s, opacity 0.2s; }
  .node-body   { transition: fill-opacity 0.2s, stroke-opacity 0.2s; }
  .node-ring-pos { }
  .node-ring-neg { }
  .node-ring-neu { }

  .node-label {
    font-family: 'DM Sans', sans-serif; font-weight: 600;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(7,7,13,1), 0 0 4px rgba(7,7,13,1), 1px 1px 0 rgba(7,7,13,.9), -1px -1px 0 rgba(7,7,13,.9);
  }

  /* ── TOOLTIP ── */
  #tt {
    position: absolute;
    background: rgba(14,14,22,0.97);
    border: 1px solid rgba(129,140,248,0.3);
    border-radius: 9px; padding: 13px 16px;
    font-size: 12px; pointer-events: none; opacity: 0;
    transition: opacity 0.15s; z-index: 50; max-width: 260px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  }
  #tt.on { opacity: 1; }
  #tt-title { font-family: 'DM Serif Display', serif; font-size: 14px; color: #818cf8; margin-bottom: 8px; }
  .tt-row { color: var(--muted); font-size: 11px; line-height: 1.7; }
  .tt-row b { color: var(--text); }
  .tone-bar-wrap { display: flex; align-items: center; gap: 6px; margin: 8px 0 4px; }
  .tone-bar { flex: 1; height: 7px; border-radius: 3px; overflow: hidden; display: flex; }
  .tb-pos { background: var(--pos); }
  .tb-neu { background: var(--neu); opacity: 0.5; }
  .tb-neg { background: var(--neg); }
  .tone-pcts { display: flex; justify-content: space-between; font-size: 9px; font-family: 'DM Mono', monospace; }
  .tp-pos { color: var(--pos); }
  .tp-neu { color: var(--neu); }
  .tp-neg { color: var(--neg); }
  .tt-div { height: 1px; background: var(--border); margin: 8px 0; }
  .nb-wrap { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); }
  .nb-chip {
    display: inline-block; background: rgba(255,255,255,0.06); border-radius: 3px;
    padding: 2px 5px; margin: 2px 2px 0 0; color: var(--text); font-size: 9px;
  }

  /* ── CONTROLS ── */
  .ctrls {
    position: absolute; bottom: 14px; right: 14px; z-index: 20;
    display: flex; flex-direction: column; gap: 5px; align-items: flex-end;
  }
  .cbtn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
    padding: 5px 11px; border-radius: 5px; cursor: pointer; white-space: nowrap;
    transition: all 0.2s;
  }
  .cbtn:hover { border-color: #818cf8; color: #818cf8; }

  /* ── STATS BAR ── */
  .sbar {
    position: relative; z-index: 10; display: flex;
    border-top: 1px solid var(--border);
    background: rgba(7,7,13,0.96); flex-shrink: 0;
  }
  .sv { flex: 1; padding: 8px 0; text-align: center; border-right: 1px solid var(--border); }
  .sv:last-child { border-right: none; }
  .sv-n { display: block; font-family: 'DM Serif Display', serif; font-size: 17px; color: #818cf8; line-height: 1; }
  .sv-l { font-size: 9px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }

  /* tone arc sizing helpers */
  .type-tag     {}
  .type-service {}
</style>
</head>

// ─── SETUP ────────────────────────────────────────────────────────────────
const svg   = d3.select("#svg");
const gc    = document.getElementById("gc");
let W = gc.clientWidth, H = gc.clientHeight;

const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.15, 5])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

function resetZoom() {
  svg.transition().duration(700).call(zoom.transform,
    d3.zoomIdentity.translate(W/2, H/2).scale(0.78));
}

// ─── SCALES ───────────────────────────────────────────────────────────────
const cExt = d3.extent(rawNodes, d => d.count);
const rScale = d3.scaleSqrt().domain(cExt).range([7, 28]);
const wScale = d3.scaleLinear().domain([4, 158]).range([0.8, 9]);
const opScale = d3.scaleLinear().domain([4, 158]).range([0.15, 0.75]);

const COL_TAG = "#818cf8";
const COL_SVC = "#14b8a6";
const COL_POS = "#4ade80";
const COL_NEU = "#94a3b8";
const COL_NEG = "#f87171";

// tone dominant color
function toneColor(d) {
  const total = d.pos + d.neu + d.neg;
  if (!total) return COL_NEU;
  const pctPos = d.pos / total, pctNeg = d.neg / total;
  if (pctNeg > 0.4) return COL_NEG;
  if (pctPos > 0.7) return COL_POS;
  if (pctNeg > 0.25) return d3.interpolateRgb(COL_NEU, COL_NEG)(pctNeg * 2);
  return d3.interpolateRgb(COL_NEU, COL_POS)(pctPos);
}

function nodeColor(d) { return d.type === "tag" ? COL_TAG : COL_SVC; }

// ─── ADJACENCY ────────────────────────────────────────────────────────────
const adj = {};
rawNodes.forEach(n => adj[n.id] = []);
rawEdges.forEach(e => {
  adj[e.source] = adj[e.source] || [];
  adj[e.target] = adj[e.target] || [];
  adj[e.source].push({ id: e.target, w: e.weight });
  adj[e.target].push({ id: e.source, w: e.weight });
});

// ─── SIMULATION ───────────────────────────────────────────────────────────
const nodes = rawNodes.map(d => ({ ...d }));
const links = rawEdges.map(d => ({ ...d }));

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id)
    .distance(d => 50 + 180 / Math.sqrt(d.weight))
    .strength(d => 0.35 + d.weight / 500))
  .force("charge", d3.forceManyBody().strength(d => -220 - d.count * 0.3))
  .force("center", d3.forceCenter(0, 0))
  .force("collision", d3.forceCollide().radius(d => rScale(d.count) + 16))
  .alphaDecay(0.022);

let frozen = false;
function toggleFreeze() {
  frozen = !frozen;
  document.getElementById("fbtn").textContent = frozen ? "▶ Reanudar" : "❄ Congelar";
  frozen ? sim.stop() : sim.alpha(0.3).restart();
}

// ─── LINKS ────────────────────────────────────────────────────────────────
const linkSel = g.append("g").attr("class","links")
  .selectAll("line").data(links).join("line")
  .attr("class","link")
  .attr("stroke", d => {
    const sn = rawNodes.find(n => n.id === d.source || n.id === d.source?.id);
    return sn ? nodeColor(sn) : "#fff";
  })
  .attr("stroke-opacity", d => opScale(d.weight))
  .attr("stroke-width",   d => wScale(d.weight));

// ─── NODES ────────────────────────────────────────────────────────────────
const nodeSel = g.append("g").attr("class","nodes")
  .selectAll("g.ng").data(nodes).join("g").attr("class","ng")
  .call(d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end",   (e,d) => { if(!e.active) sim.alphaTarget(0); if(!frozen){d.fx=null;d.fy=null;} }))
  .on("mouseenter", showTT)
  .on("mousemove",  moveTT)
  .on("mouseleave", hideTT)
  .on("click",      onNodeClick);

// Outer glow
nodeSel.append("circle").attr("class","node-glow")
  .attr("r", d => rScale(d.count) + 6)
  .attr("fill", d => nodeColor(d))
  .attr("opacity", 0.07);

// Tone ring (arc-based donut)
// We'll draw three arcs for pos/neu/neg proportions
nodeSel.each(function(d) {
  const r = rScale(d.count);
  const ringR = r + 4;
  const total = d.pos + d.neu + d.neg || 1;
  const segments = [
    { pct: d.pos / total, color: COL_POS },
    { pct: d.neu / total, color: COL_NEU, opacity: 0.55 },
    { pct: d.neg / total, color: COL_NEG },
  ];
  let startAngle = -Math.PI / 2;
  segments.forEach(seg => {
    if (seg.pct < 0.01) return;
    const endAngle = startAngle + seg.pct * 2 * Math.PI;
    const arc = d3.arc().innerRadius(ringR - 2.5).outerRadius(ringR).startAngle(startAngle).endAngle(endAngle);
    d3.select(this).append("path")
      .attr("d", arc)
      .attr("fill", seg.color)
      .attr("opacity", seg.opacity || 0.85)
      .attr("class", "tone-arc");
    startAngle = endAngle;
  });
});

// Main circle — shape differs by type
nodeSel.each(function(d) {
  const r = rScale(d.count);
  const col = nodeColor(d);
  if (d.type === "tag") {
    d3.select(this).append("circle").attr("class","node-body")
      .attr("r", r)
      .attr("fill", col).attr("fill-opacity", 0.16)
      .attr("stroke", col).attr("stroke-width", 1.5).attr("stroke-opacity", 0.75);
  } else {
    // Rounded rect for services
    const s = r * 1.55;
    d3.select(this).append("rect").attr("class","node-body")
      .attr("x", -s/2).attr("y", -s/2)
      .attr("width", s).attr("height", s).attr("rx", s * 0.22)
      .attr("fill", col).attr("fill-opacity", 0.14)
      .attr("stroke", col).attr("stroke-width", 1.5).attr("stroke-opacity", 0.75);
  }
});

// Label
nodeSel.append("text").attr("class","node-label")
  .attr("text-anchor","middle")
  .attr("dy", d => {
    const r = rScale(d.count);
    return d.type === "tag" ? r + 13 : r * 1.55 / 2 + 13;
  })
  .attr("fill", d => nodeColor(d))
  .attr("fill-opacity", 0.92)
  .style("font-size", d => rScale(d.count) >= 18 ? "11px" : "10px")
  .style("font-weight","600")
  .text(d => {
    // Shorten long service names
    const id = d.id;
    if (id.includes(" · ")) return id.split(" · ")[0];
    if (id.length > 18) return id.slice(0,16) + "…";
    return id;
  });

// ─── TICK ─────────────────────────────────────────────────────────────────
sim.on("tick", () => {
  linkSel
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

setTimeout(() => resetZoom(), 600);

// ─── HIGHLIGHT ────────────────────────────────────────────────────────────
let selected = null;

function getConn(id) {
  const s = new Set([id]);
  links.forEach(l => {
    const a = l.source.id||l.source, b = l.target.id||l.target;
    if (a===id) s.add(b); if (b===id) s.add(a);
  });
  return s;
}

function applyHL(activeId) {
  if (!activeId) {
    nodeSel.select(".node-body").attr("fill-opacity", d => d.type==="tag"?0.16:0.14).attr("stroke-opacity",0.75);
    nodeSel.selectAll(".tone-arc").attr("opacity", s => s.opacity||0.85);
    nodeSel.select("text").attr("fill-opacity",0.92);
    linkSel.attr("stroke-opacity", d=>opScale(d.weight)).attr("stroke-width",d=>wScale(d.weight));
    return;
  }
  const conn = getConn(activeId);
  nodeSel.select(".node-body")
    .attr("fill-opacity", d => conn.has(d.id) ? 0.30 : 0.04)
    .attr("stroke-opacity", d => conn.has(d.id) ? 0.9 : 0.12);
  nodeSel.selectAll(".tone-arc").attr("opacity", function(){ return 0.85; }); // keep arcs
  nodeSel.select("text").attr("fill-opacity", d => conn.has(d.id) ? 1 : 0.08);
  nodeSel.select(".node-glow").attr("opacity", d => conn.has(d.id) ? 0.12 : 0.02);
  linkSel
    .attr("stroke-opacity", l => {
      const a=l.source.id||l.source, b=l.target.id||l.target;
      return (a===activeId||b===activeId) ? Math.min(opScale(l.weight)*1.6,1) : 0.03;
    })
    .attr("stroke-width", l => {
      const a=l.source.id||l.source, b=l.target.id||l.target;
      return (a===activeId||b===activeId) ? wScale(l.weight)+1.5 : wScale(l.weight)*0.4;
    });
}

function onNodeClick(e, d) {
  e.stopPropagation();
  selected = selected===d.id ? null : d.id;
  applyHL(selected);
}
svg.on("click", () => { selected=null; applyHL(null); });

// ─── SEARCH ───────────────────────────────────────────────────────────────
function onSearch(v) {
  if (!v.trim()) { selected=null; applyHL(null); return; }
  const m = nodes.find(n => n.id.toLowerCase().includes(v.toLowerCase()));
  if (m) applyHL(m.id);
}

// ─── TYPE FILTER ──────────────────────────────────────────────────────────
document.querySelectorAll("#lg-type .leg-item").forEach(item => {
  item.addEventListener("click", () => {
    const f = item.dataset.filter;
    item.classList.toggle("off");
    const show = !item.classList.contains("off");
    nodeSel.filter(d => d.type===f)
      .style("opacity", show ? 1 : 0.1)
      .style("pointer-events", show ? "all" : "none");
  });
});

// ─── TOOLTIP ──────────────────────────────────────────────────────────────
const ttEl = document.getElementById("tt");

function showTT(e, d) {
  const total = d.pos+d.neu+d.neg||1;
  const pp = (d.pos/total*100).toFixed(0), pn = (d.neu/total*100).toFixed(0), pg = (d.neg/total*100).toFixed(0);
  document.getElementById("tt-title").textContent = d.id;
  document.getElementById("tt-type").innerHTML =
    `Tipo: <b>${d.type==="tag"?"Etiqueta":"Servicio UDELAR"}</b>`;
  document.getElementById("tt-count").innerHTML =
    `<b>${d.count.toLocaleString()}</b> menciones totales`;
  document.getElementById("tt-bar").innerHTML =
    `<div class="tb-pos" style="width:${pp}%"></div><div class="tb-neu" style="width:${pn}%;opacity:.5"></div><div class="tb-neg" style="width:${pg}%"></div>`;
  document.getElementById("tp-pos").textContent = `✦ ${pp}% pos`;
  document.getElementById("tp-neu").textContent = `${pn}% neu`;
  document.getElementById("tp-neg").textContent = `${pg}% neg ✦`;
  const nb = (adj[d.id]||[]).sort((a,b)=>b.w-a.w);
  document.getElementById("tt-nb").innerHTML =
    `<span style="display:block;margin-bottom:4px;color:var(--muted)">Conectado con <b style="color:var(--text)">${nb.length}</b> nodos:</span>` +
    nb.slice(0,7).map(n=>`<span class="nb-chip">${n.id.split(" · ")[0].slice(0,14)} <span style="opacity:.45">${n.w}</span></span>`).join("") +
    (nb.length>7?`<span class="nb-chip">+${nb.length-7}</span>`:"");
  ttEl.classList.add("on");
  moveTT(e);
}

function moveTT(e) {
  const x=e.clientX+16, y=e.clientY-90;
  ttEl.style.left=Math.min(x,window.innerWidth-280)+"px";
  ttEl.style.top=Math.max(y,50)+"px";
}

function hideTT() { ttEl.classList.remove("on"); }

window.addEventListener("resize",()=>{W=gc.clientWidth;H=gc.clientHeight;});
</script>
